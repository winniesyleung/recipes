<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The List — Daily Task Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0d0d0d; --bg-elevated: #1a1a1a; --fg: #e8e8e8; --fg-muted: #888; --accent: #00d4aa; --accent-dim: #00d4aa33; --border: #333; --card-bg: #141414; --completed: #555; }
    @media (prefers-color-scheme: light) { :root { --bg: #fafafa; --bg-elevated: #fff; --fg: #1a1a1a; --fg-muted: #666; --accent: #00a888; --accent-dim: #00a88822; --border: #e0e0e0; --card-bg: #fff; --completed: #999; } }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; padding: 24px; line-height: 1.6; }
    .container { max-width: 800px; margin: 0 auto; }
    header { margin-bottom: 32px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 12px; }
    h1 .icon { font-size: 1.5rem; }
    .date-badge { font-size: 0.875rem; color: var(--fg-muted); font-weight: 400; margin-left: 8px; }
    .stats { display: flex; gap: 16px; margin-top: 16px; flex-wrap: wrap; }
    .stat { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 20px; display: flex; align-items: center; gap: 8px; }
    .stat-value { font-size: 1.5rem; font-weight: 700; }
    .stat-label { font-size: 0.75rem; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .category-section { margin-bottom: 28px; }
    .category-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .category-color { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .category-header h2 { font-size: 1.1rem; font-weight: 600; text-transform: capitalize; }
    .category-count { font-size: 0.75rem; color: var(--fg-muted); background: var(--bg-elevated); padding: 2px 8px; border-radius: 100px; margin-left: auto; }
    .task-list { list-style: none; }
    .task-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: flex-start; gap: 12px; transition: all 0.2s ease; }
    .task-item:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-dim); }
    .task-item.completed { opacity: 0.5; }
    .task-item.completed .task-text { text-decoration: line-through; color: var(--completed); }
    .task-checkbox { width: 22px; height: 22px; border: 2px solid var(--border); border-radius: 6px; flex-shrink: 0; margin-top: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; background: transparent; }
    .task-checkbox:hover { border-color: var(--accent); }
    .task-checkbox.checked { background: var(--accent); border-color: var(--accent); }
    .task-checkbox.checked::after { content: '✓'; color: var(--bg); font-size: 14px; font-weight: bold; }
    .task-content { flex: 1; min-width: 0; }
    .task-text { font-size: 0.95rem; word-break: break-word; }
    .task-meta { display: flex; gap: 12px; margin-top: 6px; font-size: 0.7rem; color: var(--fg-muted); }
    .task-meta-item { display: flex; align-items: center; gap: 4px; }
    .priority-badge { padding: 2px 6px; border-radius: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; }
    .priority-high { background: #ff6b6b22; color: #ff6b6b; }
    .priority-medium { background: #ffd70022; color: #ffd700; }
    .priority-low { background: #00d4aa22; color: #00d4aa; }
    .due-date.overdue { color: #ff6b6b; font-weight: 600; }
    .due-date.today { color: var(--accent); font-weight: 600; }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--fg-muted); font-size: 0.9rem; }
    .actions { display: flex; gap: 12px; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .btn { padding: 10px 20px; border-radius: 8px; font-size: 0.875rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px; }
    .btn-primary { background: var(--accent); color: var(--bg); }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-secondary { background: var(--bg-elevated); color: var(--fg); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--accent); }
    .footer-note { margin-top: 32px; padding: 16px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; font-size: 0.8rem; color: var(--fg-muted); line-height: 1.7; }
    .footer-note code { background: var(--bg-elevated); padding: 2px 6px; border-radius: 4px; font-family: 'SF Mono', Monaco, monospace; font-size: 0.75rem; }
    @media (max-width: 480px) { body { padding: 16px; } h1 { font-size: 1.5rem; } .stats { gap: 12px; } .stat { padding: 10px 16px; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><span class="icon">📋</span> The List <span class="date-badge" id="dateDisplay"></span></h1>
      <div class="stats">
        <div class="stat"><span class="stat-value" id="totalTasks">0</span><span class="stat-label">Total</span></div>
        <div class="stat"><span class="stat-value" id="completedTasks">0</span><span class="stat-label">Done</span></div>
        <div class="stat"><span class="stat-value" id="pendingTasks">0</span><span class="stat-label">Pending</span></div>
        <div class="stat"><span class="stat-value" id="overdueTasks">0</span><span class="stat-label">Overdue</span></div>
      </div>
    </header>
    <main id="taskContainer"></main>
    <div class="actions">
      <button class="btn btn-primary" onclick="copyTasksToClipboard()">📋 Copy for Phone</button>
      <button class="btn btn-secondary" onclick="openTelegramDeepLink()">📱 Send to Telegram</button>
      <button class="btn btn-secondary" onclick="exportToGoogleTasks()">☁️ Export to Google Tasks</button>
      <button class="btn btn-secondary" onclick="location.reload()">🔄 Refresh</button>
    </div>
    <div class="footer-note">
      <strong>Phone Integration:</strong><br>
      • <strong>Copy for Phone</strong> — paste into Apple Reminders, Notes<br>
      • <strong>Send to Telegram</strong> — opens Telegram with pre-filled message<br>
      • <strong>Export to Google Tasks</strong> — opens tasks.google.com<br>
      • <strong>Cron Job</strong> — auto Telegram at 9am HKT
    </div>
  </div>
  <script>
    const CATEGORY_CONFIG = { personal: { label: '🧘 Personal', color: '#00d4aa', order: 1 }, fund_raising: { label: '💰 Fund Raising', color: '#ffd700', order: 2 }, venture_building: { label: '🚀 Venture Building', color: '#ff6b6b', order: 3 } };
    const PRIORITY_LABELS = { high: 'High', medium: 'Med', low: 'Low' };
    const PRIORITY_CLASSES = { high: 'priority-high', medium: 'priority-medium', low: 'priority-low' };
    async function loadTasks() { try { const r = await fetch('daily_tasks.json?t=' + Date.now()); if (!r.ok) throw new Error('Failed'); return await r.json(); } catch { return { tasks: [], categories: CATEGORY_CONFIG }; } }
    function formatDate(d) { if (!d) return null; const date = new Date(d + 'T00:00:00'), today = new Date(); today.setHours(0,0,0,0); const diff = Math.round((date - today) / 864e5); if (diff < 0) return { text: `Overdue (${d})`, class: 'overdue' }; if (diff === 0) return { text: `Today (${d})`, class: 'today' }; if (diff === 1) return { text: `Tomorrow (${d})`, class: '' }; return { text: d, class: '' }; }
    function getTodayString() { return new Date().toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Hong_Kong' }); }
    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
    async function renderTasks(data) { const container = document.getElementById('taskContainer'); const tasks = data.tasks || []; const cats = data.categories || CATEGORY_CONFIG; const sorted = Object.entries(cats).sort((a,b) => a[1].order - b[1].order); let total = tasks.length, completed = tasks.filter(t => t.completed).length, pending = total - completed, overdue = 0; const today = new Date(); today.setHours(0,0,0,0); tasks.forEach(t => { if (!t.completed && t.due_date) { const due = new Date(t.due_date + 'T00:00:00'); if (due < today) overdue++; } }); document.getElementById('dateDisplay').textContent = getTodayString(); document.getElementById('totalTasks').textContent = total; document.getElementById('completedTasks').textContent = completed; document.getElementById('pendingTasks').textContent = pending; document.getElementById('overdueTasks').textContent = overdue; let html = ''; for (const [ck, cc] of sorted) { const ct = tasks.filter(t => t.category === ck); if (!ct.length) continue; const ccDone = ct.filter(t => t.completed).length; html += `<section class="category-section"><div class="category-header"><div class="category-color" style="background:${cc.color}"></div><h2>${cc.label}</h2><span class="category-count">${ccDone}/${ct.length} done</span></div><ul class="task-list">`; const po = { high: 0, medium: 1, low: 2 }; ct.sort((a,b) => { if (a.completed !== b.completed) return a.completed ? 1 : -1; const pa = po[a.priority] ?? 3, pb = po[b.priority] ?? 3; if (pa !== pb) return pa - pb; if (a.due_date && b.due_date) return new Date(a.due_date) - new Date(b.due_date); if (a.due_date) return -1; if (b.due_date) return 1; return 0; }); for (const t of ct) { const di = formatDate(t.due_date), dh = di ? `<span class="task-meta-item due-date ${di.class}">📅 ${di.text}</span>` : '', ph = t.priority ? `<span class="priority-badge ${PRIORITY_CLASSES[t.priority]}">${PRIORITY_LABELS[t.priority]}</span>` : ''; html += `<li class="task-item ${t.completed ? 'completed' : ''}" data-id="${t.id}"><button class="task-checkbox ${t.completed ? 'checked' : ''}" onclick="toggleTask('${t.id}')"></button><div class="task-content"><div class="task-text">${escapeHtml(t.text)}</div><div class="task-meta">${ph}${dh}</div></div></li>`; } html += '</ul></section>'; } if (!html) html = '<div class="empty-state">No tasks yet. Add via CLI or edit daily_tasks.json</div>'; container.innerHTML = html; }
    async function toggleTask(id) { try { await fetch('/api/tasks/toggle', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) }); location.reload(); } catch { alert('API not available. Edit daily_tasks.json manually.'); } }
    function buildText(data) { const tasks = data.tasks || []; const cats = data.categories || CATEGORY_CONFIG; const sorted = Object.entries(cats).sort((a,b) => a[1].order - b[1].order); let txt = `📋 The List — ${getTodayString()}\n\n`; for (const [ck, cc] of sorted) { const ct = tasks.filter(t => t.category === ck && !t.completed); if (!ct.length) continue; txt += `${cc.label}\n`; for (const t of ct) { const di = formatDate(t.due_date), ds = di ? ` (${di.text})` : '', ps = t.priority ? ` [${PRIORITY_LABELS[t.priority]}]` : ''; txt += `• ${t.text}${ds}${ps}\n`; } txt += '\n'; } const dc = tasks.filter(t => t.completed).length; if (dc) txt += `✅ Completed: ${dc}\n`; return txt.trim(); }
    async function copyTasksToClipboard() { const d = await loadTasks(); await navigator.clipboard.writeText(buildText(d)); const b = event.target.closest('button'); const o = b.innerHTML; b.innerHTML = '✅ Copied!'; setTimeout(() => b.innerHTML = o, 2000); }
    function openTelegramDeepLink() { loadTasks().then(d => { const t = buildText(d), e = encodeURIComponent(t); window.open(`tg://msg?text=${e}`, '_blank'); setTimeout(() => window.open(`https://t.me/savedmessages?text=${e}`, '_blank'), 500); }); }
    function exportToGoogleTasks() { window.open('https://tasks.google.com/', '_blank'); }
    document.addEventListener('DOMContentLoaded', async () => { const d = await loadTasks(); renderTasks(d); });
  </script>
</body>
</html>
